              - cell "281,000" [ref=f5e89]
        - paragraph [ref=f5e90]: "That is a real number: around PKR 280,000 in year one for one screen — and you still cannot take orders with it. A menu board is a display, not an ordering system."
        - heading "How to Reduce the Cost" [level=2] [ref=f5e91]
        - paragraph [ref=f5e92]: "You can cut costs three ways:"
        - paragraph [ref=f5e93]: • Use an existing TV you already own and pay only for software (PKR 5,000-10,000/month)
        - paragraph [ref=f5e94]: • Buy a slightly smaller screen
        - paragraph [ref=f5e95]: • Choose a single-screen plan instead of a multi-screen package
        - paragraph [ref=f5e96]: Even at minimum cost, you are still paying a recurring software fee for a display-only tool.
