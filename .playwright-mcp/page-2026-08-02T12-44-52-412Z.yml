      - generic [ref=f4e15]:
        - paragraph [ref=f4e16]: A digital menu is the single biggest upgrade a restaurant can make this year. It replaces printed cards that cost thousands in reprints, kills the 25-35% commission of delivery apps, shows your food in mouth-watering photos, and takes orders directly on WhatsApp. This guide covers everything — what a digital menu is, every type available, what it costs in Pakistan, and exactly how to set one up in under 30 minutes.
        - heading "What Is a Digital Menu?" [level=2] [ref=f4e17]
        - paragraph [ref=f4e18]:
          - text: A digital menu is a web-based version of your restaurant menu that customers open on their phone. Instead of a printed card, they scan a
          - link "QR code restaurant menu" [ref=f4e19] [cursor=pointer]:
            - /url: /digital-menu-for-restaurants
          - text: with their camera (or tap a link) and your full menu appears instantly — dishes, descriptions, prices, and photos, organized into categories. It is always up to date, never needs reprinting, and can be connected directly to ordering.
