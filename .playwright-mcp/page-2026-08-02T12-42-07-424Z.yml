        - paragraph [ref=f2e86]: All paid plans include unlimited orders, QR code generation, WhatsApp ordering, and analytics. There are no hidden fees. No commission on orders. Cancel anytime.
        - heading "Tips to Make Your QR Menu Successful" [level=2] [ref=f2e87]
        - paragraph [ref=f2e88]: Use high-quality food photos. Blurry or dark photos make even the best food look unappetizing. Take photos during daylight near a window, or invest in a simple phone light. Keep prices updated. If your prices change, update them in your dashboard immediately. Customers trust accurate pricing. Add Urdu translations. Many customers prefer reading menus in Urdu. Adding Urdu names and descriptions makes your menu more accessible and welcoming. Highlight your best-selling dishes. Use tags like "Popular" or "Chef Special" to guide customers toward your signature items. Promote your QR code on social media. Share it on your Instagram bio, Facebook page, and WhatsApp status. The more people scan, the more orders you get.
        - heading "Frequently Asked Questions" [level=2] [ref=f2e89]
        - paragraph [ref=f2e90]: "Q: Do customers need to download an app? No. They scan with their phone camera and everything works in their browser. No app store needed."
        - paragraph [ref=f2e91]: "Q: Can I update my menu anytime? Yes. Changes are instant. Update prices, add new dishes, or remove items in real-time from your dashboard."
        - paragraph [ref=f2e92]: "Q: How do payments work? Payments are handled directly between you and your customer — via JazzCash, Easypaisa, bank transfer, or cash on delivery. Digital QR Menue does not take any cut."
        - paragraph [ref=f2e93]: "Q: What if my trial expires? You have a 3-day grace period before your menu goes offline. Upgrade to any paid plan to reactivate instantly. Your data is preserved."
        - paragraph [ref=f2e94]: "Q: Can I use my existing phone number? Yes, you can connect any WhatsApp number — personal or WhatsApp Business."
        - paragraph [ref=f2e95]: Ready to create your QR code menu? Start your 30-day free trial today — no credit card required.
