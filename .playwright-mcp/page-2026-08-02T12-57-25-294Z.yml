              - cell "Media player" [ref=f7e73]
              - cell "15,000" [ref=f7e74]
            - row [ref=f7e75]:
              - cell "Mounting + install" [ref=f7e76]
              - cell "10,000" [ref=f7e77]
            - row [ref=f7e78]:
              - cell "Setup/content design" [ref=f7e79]
              - cell "10,000" [ref=f7e80]
            - row [ref=f7e81]:
              - cell "Total upfront" [ref=f7e82]
              - cell "185,000" [ref=f7e83]
            - row [ref=f7e84]:
              - cell "Software (PKR 8,000/month × 12)" [ref=f7e85]
              - cell "96,000/year" [ref=f7e86]
            - row [ref=f7e87]:
              - cell "Year-one total" [ref=f7e88]
              - cell "281,000" [ref=f7e89]
        - paragraph [ref=f7e90]: "That is a real number: around PKR 280,000 in year one for one screen — and you still cannot take orders with it. A menu board is a display, not an ordering system."
        - heading "What You Are Really Paying For" [level=2] [ref=f7e91]
        - paragraph [ref=f7e92]: "Break down the PKR 280,000 and you see the cost is not the screen — it is the ongoing operation. The screen is a one-time asset, but the media player, the software subscription, the content design, and the maintenance recur. You are paying a monthly fee for a display that cannot take an order, reach a customer outside your store, or share a menu link on WhatsApp. That recurring cost is the silent budget-killer: it shows up on your books every single month, long after the excitement of the new screen fades."
        - paragraph [ref=f7e93]: "Compare that with what the same money could do elsewhere in your restaurant: a QR code menu for a full year, plus a real marketing budget, plus better ingredients. The opportunity cost of a menu board is not just its price tag — it is everything that money no longer buys."
        - heading "Hidden Costs People Forget" [level=2] [ref=f7e94]
        - paragraph [ref=f7e95]: "Three costs surprise most buyers:"
        - paragraph [ref=f7e96]: "• Electricity: a commercial display running 12-16 hours a day adds a noticeable monthly power bill, especially in summer when AC is already running"
        - paragraph [ref=f7e97]: "• Content design: someone has to design the menu layouts, update prices, and keep the screens accurate — that is hours of staff time every month"
        - paragraph [ref=f7e98]: "• Breakdowns and replacement: commercial screens fail, and consumer TVs used as menu boards fail faster; a replacement is another PKR 80,000-200,000"
        - paragraph [ref=f7e99]: None of these appear on the sticker price, but all of them are real. A QR menu has none of them — customers bring their own screens and their own power.
        - heading "How to Reduce the Cost" [level=2] [ref=f7e100]
        - paragraph [ref=f7e101]: "You can cut costs three ways:"
        - paragraph [ref=f7e102]: • Use an existing TV you already own and pay only for software (PKR 5,000-10,000/month)
        - paragraph [ref=f7e103]: • Buy a slightly smaller screen
        - paragraph [ref=f7e104]: • Choose a single-screen plan instead of a multi-screen package
        - paragraph [ref=f7e105]: Even at minimum cost, you are still paying a recurring software fee for a display-only tool.
