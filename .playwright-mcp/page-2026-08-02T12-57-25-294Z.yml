              - columnheader "Notes" [ref=f7e25]
          - rowgroup [ref=f7e26]:
            - row [ref=f7e27]:
              - cell "32-inch consumer TV" [ref=f7e28]
              - cell "PKR 45,000-70,000" [ref=f7e29]
              - cell "Cheapest, but not built for 24/7 use" [ref=f7e30]
            - row [ref=f7e31]:
              - cell "32-inch commercial display" [ref=f7e32]
              - cell "PKR 80,000-120,000" [ref=f7e33]
              - cell "Bright enough for a counter" [ref=f7e34]
            - row [ref=f7e35]:
              - cell "43-inch commercial display" [ref=f7e36]
              - cell "PKR 120,000-180,000" [ref=f7e37]
              - cell "Common size for a menu board" [ref=f7e38]
            - row [ref=f7e39]:
              - cell "55-inch commercial display" [ref=f7e40]
              - cell "PKR 180,000-250,000" [ref=f7e41]
              - cell "Best for larger counters" [ref=f7e42]
            - row [ref=f7e43]:
              - cell "Professional signage package" [ref=f7e44]
              - cell "PKR 300,000-500,000" [ref=f7e45]
              - cell "Screen + player + mounting + software" [ref=f7e46]
        - paragraph [ref=f7e47]: "Commercial displays cost more than consumer TVs for a reason: they run 24/7, stay bright in daylight, and last years. A consumer TV will work but burns out faster under constant use. The prices above are typical street prices in Lahore, Karachi, and Islamabad — shop around and you may find better deals."
        - heading "The Cost of the Media Player" [level=2] [ref=f7e48]
        - paragraph [ref=f7e49]: "You need a small computer to run the menu software. Options:"
        - paragraph [ref=f7e50]: "• Android TV box: PKR 8,000-15,000 — the budget choice"
        - paragraph [ref=f7e51]: "• Dedicated digital signage player (BrightSign, etc.): PKR 25,000-60,000 — more reliable"
        - paragraph [ref=f7e52]: "• Built into a professional package: already included in the PKR 300,000+ price"
        - heading "The Cost of Mounting and Installation" [level=2] [ref=f7e53]
        - paragraph [ref=f7e54]: A proper wall mount plus installation runs PKR 5,000-15,000 depending on the wall and height. Add cabling and a surge protector if the location lacks clean power.
        - heading "The Monthly Software Cost" [level=2] [ref=f7e55]
        - paragraph [ref=f7e56]: "This is the ongoing bill people forget. Most menu board software charges a subscription:"
        - paragraph [ref=f7e57]: "• Basic single-screen plans: PKR 5,000-10,000 per month"
        - paragraph [ref=f7e58]: "• Multi-screen and premium plans: PKR 15,000-30,000+ per month"
        - paragraph [ref=f7e59]: • Some Pakistani providers bundle hardware + software at a higher upfront price
        - heading "The Total Cost of Ownership" [level=2] [ref=f7e60]
        - paragraph [ref=f7e61]: "Let's add it up for a typical single-screen setup:"
        - table [ref=f7e63]:
          - rowgroup [ref=f7e64]:
            - row [ref=f7e65]:
              - columnheader "Item" [ref=f7e66]
              - columnheader "One-Time (PKR)" [ref=f7e67]
          - rowgroup [ref=f7e68]:
            - row [ref=f7e69]:
              - cell "43-inch commercial display" [ref=f7e70]
              - cell "150,000" [ref=f7e71]
