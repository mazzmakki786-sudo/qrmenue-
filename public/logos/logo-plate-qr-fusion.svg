<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5"/>
      <stop offset="100%" style="stop-color:#E0E0E0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="80" fill="white" stroke="#E0E0E0" stroke-width="2"/>
  <!-- Plate circle -->
  <circle cx="200" cy="170" r="90" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="200" cy="170" r="70" fill="none" stroke="#EEE" stroke-width="2"/>
  <!-- QR code inside plate center -->
  <g transform="translate(168, 138)" fill="#111">
    <rect x="0" y="0" width="8" height="8"/><rect x="0" y="24" width="8" height="8"/>
    <rect x="24" y="0" width="8" height="8"/><rect x="24" y="24" width="8" height="8"/>
    <rect x="12" y="12" width="4" height="4" fill="#25D366"/>
    <rect x="0" y="48" width="8" height="8"/><rect x="48" y="0" width="8" height="8"/>
    <rect x="48" y="48" width="8" height="8"/>
  </g>
  <!-- Steam/wisps from plate -->
  <path d="M165 75 Q170 60 175 75" fill="none" stroke="#CCC" stroke-width="2" stroke-linecap="round"/>
  <path d="M195 70 Q200 55 205 70" fill="none" stroke="#CCC" stroke-width="2" stroke-linecap="round"/>
  <path d="M225 75 Q230 60 235 75" fill="none" stroke="#CCC" stroke-width="2" stroke-linecap="round"/>
  <!-- Fork & Knife -->
  <g transform="translate(290, 130)" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round">
    <path d="M0 0 L0 60"/>
    <path d="M0 0 Q-8 10 -8 25"/>
    <path d="M0 0 Q8 10 8 25"/>
    <path d="M15 0 L15 60"/>
    <path d="M15 0 L20 15 L22 15 L18 30"/>
  </g>
  <text x="200" y="310" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111" text-anchor="middle" letter-spacing="1">DIGITAL QR MENUE</text>
  <text x="200" y="340" font-family="system-ui, sans-serif" font-size="13" fill="#888" text-anchor="middle" letter-spacing="3">DINE · SCAN · ORDER</text>
</svg>
