<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" rx="80" fill="#075E54"/>
  <!-- WhatsApp bubble -->
  <g transform="translate(80, 80)">
    <path d="M120 0C53.7 0 0 53.7 0 120c0 26.3 8.5 50.8 22.9 70.6L16 240l52.2-17.1C87.2 235.4 112.5 240 120 240c66.3 0 120-53.7 120-120S186.3 0 120 0z" fill="white"/>
    <!-- Chat dots / food icons inside bubble -->
    <g transform="translate(40, 55)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#25D366"/>
      <rect x="20" y="0" width="12" height="12" rx="2" fill="#25D366"/>
      <rect x="40" y="0" width="12" height="12" rx="2" fill="#25D366"/>
      <rect x="60" y="0" width="12" height="12" rx="2" fill="#25D366"/>
      <rect x="0" y="20" width="12" height="12" rx="2" fill="#25D366"/>
      <rect x="20" y="20" width="60" height="30" rx="4" fill="#25D366"/>
    </g>
    <!-- QR code inside bubble -->
    <g transform="translate(100, 100)" fill="#075E54">
      <rect x="0" y="0" width="15" height="15"/>
      <rect x="0" y="35" width="15" height="15"/>
      <rect x="35" y="0" width="15" height="15"/>
      <rect x="20" y="20" width="10" height="10" fill="#25D366"/>
    </g>
  </g>
  <text x="200" y="310" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1">DIGITAL QR MENUE</text>
  <text x="200" y="340" font-family="system-ui, sans-serif" font-size="14" fill="#25D366" text-anchor="middle" letter-spacing="3">WHATSAPP ORDERING</text>
</svg>
