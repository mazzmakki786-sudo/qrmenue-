<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>
  <!-- MENU text as QR pattern -->
  <g transform="translate(100, 140)" fill="white">
    <!-- M -->
    <rect x="0" y="0" width="10" height="40"/>
    <rect x="10" y="0" width="10" height="10"/>
    <rect x="30" y="0" width="10" height="10"/>
    <rect x="40" y="0" width="10" height="40"/>
    <rect x="20" y="10" width="10" height="30"/>
    <!-- E -->
    <rect x="60" y="0" width="40" height="10"/>
    <rect x="60" y="0" width="10" height="40"/>
    <rect x="60" y="15" width="30" height="10"/>
    <rect x="60" y="30" width="30" height="10"/>
    <!-- N -->
    <rect x="110" y="0" width="10" height="40"/>
    <rect x="120" y="0" width="10" height="10"/>
    <rect x="130" y="10" width="10" height="10"/>
    <rect x="140" y="20" width="10" height="20"/>
    <rect x="150" y="0" width="10" height="40"/>
    <!-- U -->
    <rect x="170" y="0" width="10" height="30"/>
    <rect x="180" y="30" width="30" height="10"/>
    <rect x="210" y="0" width="10" height="30"/>
  </g>
  <!-- QR corner decorations -->
  <g fill="#25D366">
    <rect x="60" y="60" width="20" height="20" rx="3"/>
    <rect x="320" y="60" width="20" height="20" rx="3"/>
    <rect x="60" y="260" width="20" height="20" rx="3"/>
  </g>
  <text x="200" y="300" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1">DIGITAL QR MENUE</text>
  <text x="200" y="330" font-family="system-ui, sans-serif" font-size="14" fill="#888" text-anchor="middle" letter-spacing="3">PAKISTAN</text>
</svg>
