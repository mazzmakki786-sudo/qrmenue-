<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F5F5F5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="80" fill="url(#bgd)" stroke="black" stroke-width="2"/>
  <!-- Phone outline -->
  <g transform="translate(130, 70)">
    <rect x="0" y="0" width="140" height="240" rx="20" fill="none" stroke="black" stroke-width="4"/>
    <rect x="50" y="10" width="40" height="6" rx="3" fill="#DDD"/>
    <!-- Screen with QR -->
    <g transform="translate(20, 35)">
      <!-- QR pattern on screen -->
      <rect x="0" y="0" width="12" height="12" fill="black"/>
      <rect x="0" y="0" width="6" height="6" fill="#25D366"/>
      <rect x="0" y="24" width="12" height="12" fill="black"/>
      <rect x="24" y="0" width="12" height="12" fill="black"/>
      <rect x="12" y="12" width="12" height="4" fill="#25D366"/>
      <rect x="0" y="48" width="8" height="8" fill="black"/>
      <rect x="40" y="48" width="8" height="8" fill="black"/>
      <rect x="80" y="0" width="8" height="8" fill="black"/>
      <rect x="88" y="0" width="12" height="12" fill="black"/>
      <rect x="48" y="24" width="8" height="8" fill="#25D366"/>
      <!-- Menu items on screen -->
      <rect x="60" y="80" width="40" height="4" rx="2" fill="#DDD"/>
      <rect x="60" y="90" width="30" height="3" rx="1.5" fill="#EEE"/>
      <rect x="60" y="100" width="35" height="3" rx="1.5" fill="#EEE"/>
      <rect x="60" y="115" width="40" height="4" rx="2" fill="#DDD"/>
      <rect x="60" y="125" width="25" height="3" rx="1.5" fill="#EEE"/>
    </g>
    <!-- Home button area -->
    <rect x="55" y="215" width="30" height="4" rx="2" fill="#DDD"/>
  </g>
  <!-- Scanning lines from phone to QR -->
  <g stroke="#25D366" stroke-width="2" stroke-dasharray="4,4" opacity="0.6">
    <line x1="270" y1="130" x2="320" y2="160"/>
    <line x1="270" y1="170" x2="320" y2="200"/>
    <line x1="270" y1="210" x2="320" y2="240"/>
  </g>
  <text x="200" y="350" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="black" text-anchor="middle" letter-spacing="1">DIGITAL QR MENUE</text>
</svg>
