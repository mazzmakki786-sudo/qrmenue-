<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="flag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#01411C"/>
      <stop offset="50%" style="stop-color:#01411C"/>
      <stop offset="50%" style="stop-color:white"/>
      <stop offset="100%" style="stop-color:white"/>
    </linearGradient>
  </defs>
  <!-- Pakistan flag inspired background -->
  <rect width="400" height="400" rx="80" fill="#01411C"/>
  <!-- White section (left) -->
  <rect x="0" y="0" width="160" height="400" rx="80" fill="white"/>
  <rect x="0" y="0" width="160" height="400" fill="white"/>
  <!-- Green section (right) -->
  <rect x="160" y="0" width="240" height="400" fill="#01411C"/>
  <!-- Rounded corners mask effect -->
  <rect width="400" height="400" rx="80" fill="none"/>
  <!-- QR Code in center spanning both -->
  <g transform="translate(130, 130)">
    <rect x="0" y="0" width="10" height="10" fill="white"/>
    <rect x="0" y="20" width="10" height="10" fill="white"/>
    <rect x="0" y="110" width="10" height="10" fill="white"/>
    <rect x="20" y="0" width="10" height="10" fill="white"/>
    <rect x="130" y="0" width="10" height="10" fill="white"/>
    <rect x="130" y="110" width="10" height="10" fill="white"/>
    <rect x="60" y="60" width="20" height="20" fill="#25D366"/>
    <rect x="0" y="60" width="10" height="10" fill="white"/>
    <rect x="130" y="60" width="10" height="10" fill="white"/>
    <rect x="100" y="0" width="10" height="10" fill="white"/>
    <!-- Star (chand sitara) -->
    <polygon points="70,30 75,45 90,45 78,55 82,70 70,60 58,70 62,55 50,45 65,45" fill="#25D366"/>
  </g>
  <!-- Text in white section -->
  <text x="80" y="320" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#01411C" text-anchor="middle" letter-spacing="2">DIGITAL QR MENUE</text>
  <text x="80" y="340" font-family="system-ui, sans-serif" font-size="9" fill="#01411C" text-anchor="middle" letter-spacing="2">Pakistan's #1</text>
</svg>
