<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" rx="80" fill="#111"/>
  <!-- Large letter D -->
  <g transform="translate(60, 40)">
    <text x="0" y="200" font-family="system-ui, sans-serif" font-size="220" font-weight="900" fill="white">D</text>
  </g>
  <!-- QR pattern overlay on D -->
  <g transform="translate(85, 65)" fill="#25D366">
    <rect x="0" y="0" width="12" height="12" rx="2"/>
    <rect x="18" y="0" width="12" height="12" rx="2"/>
    <rect x="36" y="0" width="12" height="12" rx="2"/>
    <rect x="0" y="18" width="12" height="12" rx="2"/>
    <rect x="18" y="18" width="12" height="12" rx="2" fill="white"/>
    <rect x="36" y="18" width="12" height="12" rx="2"/>
    <rect x="0" y="36" width="12" height="12" rx="2"/>
    <rect x="18" y="36" width="12" height="12" rx="2"/>
    <rect x="36" y="36" width="12" height="12" rx="2"/>
    <rect x="0" y="60" width="12" height="12" rx="2"/>
    <rect x="36" y="60" width="12" height="12" rx="2"/>
    <rect x="18" y="84" width="12" height="12" rx="2"/>
    <rect x="0" y="108" width="12" height="12" rx="2"/>
    <rect x="36" y="108" width="12" height="12" rx="2"/>
  </g>
  <!-- Star accent -->
  <g transform="translate(280, 60)">
    <polygon points="20,0 25,15 40,15 28,25 32,40 20,30 8,40 12,25 0,15 15,15" fill="#25D366"/>
  </g>
  <text x="200" y="310" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="white" text-anchor="middle" letter-spacing="2">DIGITAL QR MENUE</text>
  <text x="200" y="340" font-family="system-ui, sans-serif" font-size="12" fill="#666" text-anchor="middle" letter-spacing="4">PAKISTAN</text>
</svg>
